<!DOCTYPE html><html>
<head><title>My Files</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head><body class="bg-light"><nav class="navbar navbar-dark bg-primary">
    <div class="container">    <h4 class="text-white">
        ☁️ Cloud File Storage
    </h4>

    <a href="/dashboard" class="btn btn-light">
        Dashboard
    </a>

</div>

</nav><div class="container mt-5"><div class="card p-4 shadow">

    <h2 class="mb-4">
        📂 My Files
    </h2>


    <!-- Search -->

    <form method="GET" action="/myfiles" class="mb-4">

        <input
            type="text"
            name="search"
            placeholder="🔍 Search files..."
            value="{{ search }}"
            class="form-control w-50 d-inline">

        <button class="btn btn-primary">
            Search
        </button>

    </form>


    <table class="table table-hover">

        <thead class="table-primary">

            <tr>
                <th>File Name</th>
                <th>Actions</th>
            </tr>

        </thead>


        <tbody>

            {% if files %}

                {% for file in files %}

                <tr>

                    <td>
                        📄 {{ file.display_name }}
                    </td>


                    <td>

                        <!-- Open -->

                        <a href="{{ file.url }}"
                           target="_blank"
                           class="btn btn-success btn-sm">

                            👁️ Open

                        </a>


                        <!-- Download -->

                        <a href="{{ file.url }}"
                           download
                           class="btn btn-primary btn-sm">

                            📥 Download

                        </a>


                        <!-- Share -->

                        <button
                            onclick="shareFile('{{ file.url }}')"
                            class="btn btn-info btn-sm text-white">

                            🔗 Share

                        </button>


                        <!-- Delete -->

                        <a href="/delete/{{ file.name }}"
                           onclick="return confirm('Delete this file?')"
                           class="btn btn-danger btn-sm">

                            🗑️ Delete

                        </a>

                    </td>

                </tr>

                {% endfor %}


            {% else %}

                <tr>

                    <td colspan="2" class="text-center">

                        No files found

                    </td>

                </tr>

            {% endif %}

        </tbody>

    </table>

</div>

</div><!-- Share JavaScript --><script>

async function shareFile(fileUrl) {

    try {

        if (navigator.share) {

            await navigator.share({
                title: "Cloud File",
                text: "Check out this file",
                url: fileUrl
            });

        } else {

            await navigator.clipboard.writeText(fileUrl);

            alert("✅ File link copied successfully!");

        }

    } catch (error) {

        console.log("Share cancelled");

    }

}

</script>

</body>
</html>
